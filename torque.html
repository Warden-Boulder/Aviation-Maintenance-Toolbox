<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css?v=35">
  <script src="clear.js?v=4"></script>
  <script src="torque.js?v=5"></script>
  <script src="nav.js"></script>
</head>
<body>
  <header>
  <h1>Torque Tools</h1>
    <select onchange="Nav()" id="select">
      <option value="null">---Toolbox Navigation---</option>
      <optgroup label="General">
        <option value="about">About</option>
        <option value="home">Homepage</option>
        <option value="reference">Reference Sheet</option>
      </optgroup>
      <optgroup label="Boeing Tools">
        <option value="b737">B737 Tools</option>
        <option value="b757">B757 Tools</option>
      </optgroup>
    </select>
</header><br>
   <details>
      <summary><h3 class="underline">Torque Unit Converter</h3></summary>
      <div class="card-container">
        <div class="torque-card">
           <input type="number" id="torqueInput" min="0" step="0.001" placeholder="Enter Torque Value Here" /> <select name="Unit" id="torqueUnit">
             <option value="null">---Select Unit---</option>
             <option value="foot">Foot Pound(s)</option>
             <option value="inch">Inch Pound(s)</option>
             <option value="newton">Newton Meter(s)</option>
           </select>
          <button onclick="convertTorque()">Convert</button>
          <button onclick="Clear()">Clear</button>
          <div id="torqueResults"></div>
        </div>
      </div>
    </details><br>
      <details>
        <summary><h3 class="underline">Torque Wrench Adapter/Extension Calculator</h3></summary>
        <div class="card-container">
          <div class="extend-card">
            <p>Desired Torque Value: <input type="number" id="desire" min="0" step="0.001" placeholder="Enter Desired Torque" /></p>
            <p>Torque Wrench Length (in inches): <input type="number" id="length" min="0" step="0.001" placeholder="Enter TW Length" /></p>
            <p>Adapter/Extension Length (in inches): <input type="number" id="extension" min="0" step="0.001" placeholder="Enter Adapter/Extension Length" /></p>
            <p>Torque Wrench Setting: <select name="Unit" id="Unit">
              <option value="null">---Select---</option>
              <option value="foot pounds">Foot Pounds</option>
              <option value="inch pounds">Inch Pounds</option>
              <option value="newton meters">Newton Meters</option>
            </select></p>
            <button onclick="calculateExtension()">Calculate</button>
            <button onclick="Clear()">Clear</button>
            <div id="extResults"></div>
          </div>
        </div>
      </details>
  </details>
</body>
</html>
